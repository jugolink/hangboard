version: 2

updates:
  # The Rust graph is 545 crates deep. Monthly, grouped, so it stays a
  # reviewable diff instead of a stream of single-crate pull requests.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      rust-patch:
        applies-to: version-updates
        update-types: [patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  # Pinned to major tags on purpose (see CONTRIBUTING.md); this keeps the
  # majors themselves from rotting.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
