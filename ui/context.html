<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangboard menu</title>
    <link rel="stylesheet" href="context.css" />
  </head>
  <body>
    <div id="menu">
      <button data-action="copy">Copy</button>
      <button data-action="open">Open</button>
      <button data-action="preview">Quick Look</button>
      <button data-action="pin">Pin to Desktop</button>
      <button data-action="markup" disabled>Mark Up…</button>
      <button data-action="reveal">Show in Explorer</button>
      <button data-action="export">Save to Desktop</button>
      <div class="sep"></div>
      <button data-action="discard" class="danger">Discard</button>
      <button data-action="discard-left">Take Down Everything to the Left</button>
      <button data-action="discard-right">Take Down Everything to the Right</button>
    </div>
    <script src="context.js"></script>
  </body>
</html>
