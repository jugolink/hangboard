<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Hangboard Pin</title>
    <link rel="stylesheet" href="pin.css" />
  </head>
  <body>
    <div id="pin-card">
      <img id="pin-img" draggable="false" alt="" />

      <!-- Top-right micro control capsule (visible on hover) -->
      <div id="pin-controls">
        <span id="scale-badge" title="当前缩放 / 点击还原 100%">100%</span>
        <button id="btn-ontop" class="btn-ctrl active" title="始终置顶 (Always on Top)">📌</button>
        <button id="btn-copy" class="btn-ctrl" title="复制图片 (Copy / Ctrl+C)">📋</button>
        <button id="btn-close" class="btn-ctrl danger" title="关闭贴图 (Close / Esc)">✕</button>
      </div>

      <!-- Quick Toast message -->
      <div id="pin-toast"></div>

      <!-- Custom Mini Context Menu -->
      <div id="pin-menu" class="hidden">
        <div class="menu-item" id="menu-copy">复制图片 <kbd>Ctrl+C</kbd></div>
        <div class="menu-item" id="menu-reset">还原原始大小 (100%) <kbd>1</kbd></div>
        <div class="menu-item" id="menu-ontop">始终置顶 <span id="ontop-check">✓</span></div>
        <div class="menu-divider"></div>
        <div class="menu-item danger" id="menu-close">关闭贴图 <kbd>Esc</kbd></div>
      </div>
    </div>

    <script src="pin.js"></script>
  </body>
</html>
